<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="300" preserveAspectRatio="xMaxYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3d2e"/><stop offset="1" stop-color="#0f5a3f"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.45"><stop offset="0" stop-color="#f5c518" stop-opacity=".45"/><stop offset="1" stop-color="#f5c518" stop-opacity="0"/></radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe17a"/><stop offset="1" stop-color="#d9a400"/></linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79300"/><stop offset="1" stop-color="#8f6a00"/></linearGradient>
    <g id="c"><rect x="-70" y="0" width="140" height="22" fill="url(#coinEdge)"/><ellipse cy="22" rx="70" ry="20" fill="url(#coinEdge)"/><ellipse rx="70" ry="20" fill="url(#coin)"/><ellipse rx="48" ry="12" fill="none" stroke="#b78700" stroke-width="3"/></g>
    <style>
      .float{animation:f 4s ease-in-out infinite}.float2{animation:f 5s ease-in-out infinite reverse}
      .tw{animation:t 2.4s ease-in-out infinite}.tw2{animation:t 3.1s ease-in-out infinite .8s}
      @keyframes f{50%{transform:translateY(-14px)}}@keyframes t{0%,100%{opacity:.2}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.float,.float2,.tw,.tw2{animation:none}}
    </style>
  </defs>
  <rect x="-2400" width="4000" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>
  <g stroke="#19c37d" stroke-opacity=".12" stroke-width="2" fill="none">
    <circle cx="1150" cy="260" r="200"/><circle cx="1150" cy="260" r="290"/><circle cx="1150" cy="260" r="380"/>
  </g>
  <!-- coin stacks -->
  <g transform="translate(980 410)"><use href="#c"/><use href="#c" y="-24"/><use href="#c" y="-48"/><use href="#c" y="-72"/><use href="#c" y="-96"/></g>
  <g transform="translate(1150 420)"><use href="#c"/><use href="#c" y="-24"/><use href="#c" y="-48"/><use href="#c" y="-72"/><use href="#c" y="-96"/><use href="#c" y="-120"/><use href="#c" y="-144"/><use href="#c" y="-168"/></g>
  <g transform="translate(1320 405)"><use href="#c"/><use href="#c" y="-24"/><use href="#c" y="-48"/></g>
  <!-- floating coins -->
  <g class="float"><g transform="translate(1440 170) rotate(-18)"><use href="#c"/></g></g>
  <g class="float2"><g transform="translate(880 150) rotate(14) scale(.7)"><use href="#c"/></g></g>
  <!-- 100% badge -->
  <g transform="translate(1150 120)">
    <rect x="-150" y="-62" width="300" height="110" rx="24" fill="#071512" stroke="#f5c518" stroke-width="4"/>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="78" font-weight="900" fill="#f5c518">+100%</text>
  </g>
  <!-- sparkles -->
  <g fill="#fff3c4">
    <path class="tw" d="M1270 70l6 18 18 6-18 6-6 18-6-18-18-6 18-6z"/>
    <path class="tw2" d="M940 260l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
    <path class="tw" d="M1480 330l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
  </g>
</svg>
