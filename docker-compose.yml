services:
  postgres: {image: postgres:16-alpine, environment: {POSTGRES_DB: ushindi, POSTGRES_USER: ushindi, POSTGRES_PASSWORD: ushindi_dev}, ports: ["5432:5432"], volumes: ["pgdata:/var/lib/postgresql/data","./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]}
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  api: {build: ./apps/api, environment: {PORT: 4000, DATABASE_URL: postgres://ushindi:ushindi_dev@postgres:5432/ushindi, REDIS_URL: redis://redis:6379}, ports: ["4000:4000"], depends_on: [postgres, redis]}
  web: {build: ./apps/web, ports: ["5173:80"], depends_on: [api]}
volumes: {pgdata: {}}
